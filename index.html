<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#3a2a1c">
<title>ころころ ブロックワールド</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<script>
  // GitHub Pages は JS/CSS を10分キャッシュさせるので、更新直後に古いファイルが混ざらないよう毎回読みなおす。
  // js/ にファイルを増やしたら FILES にも足すこと
  (() => {
    const FILES = ['main', 'game', 'house', 'friends', 'physics', 'stages', 'art', 'sensor', 'sound', 'save'];
    const v = Date.now();
    const imports = {};
    for (const f of FILES) imports[new URL(`js/${f}.js`, location.href).href] = `./js/${f}.js?v=${v}`;
    document.write(`<link rel="stylesheet" href="css/style.css?v=${v}">`);
    document.write(`<script type="importmap">${JSON.stringify({ imports })}<\/script>`);
  })();
</script>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title" class="screen">
  <h1>ころころ<span class="sub">ブロックワールド</span></h1>
  <button id="bPlay" class="big">あそぶ</button>
</div>

<div id="select" class="screen hidden">
  <h2>どこで あそぶ？</h2>
  <div id="stageList"></div>
  <div id="inventory"></div>
  <button id="bHouse" class="btn go">🏠 おうちを つくる</button>
</div>

<div id="clear" class="screen hidden">
  <h2 id="clearTitle">クリア！</h2>
  <div id="clearItems"></div>
  <div id="clearFriend"></div>
  <p id="clearNote" class="note"></p>
  <div class="row">
    <button id="bRetry" class="btn">もういちど</button>
    <button id="bNext" class="btn go">つぎへ ▶</button>
  </div>
  <button id="bToSelect" class="btn">ステージを えらぶ</button>
</div>

<div id="palette" class="hidden"></div>

<div id="gift" class="screen hidden">
  <h2>はじめての おうちづくり！</h2>
  <p class="note">プレゼントだよ</p>
  <div id="giftItems"></div>
  <button id="bGiftOk" class="big">やったー！</button>
</div>

<button id="bBack" class="hidden">◀ もどる</button>

<!-- import map を通すため src ではなく import で読む -->
<script type="module">import './js/main.js';</script>
</body>
</html>
